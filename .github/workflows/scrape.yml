name: Competition Hub Daily Scrape

on:
  schedule:
    # Runs daily at 01:00 UTC (08:00 WIB)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum items to scrape'
        required: false
        default: '25'

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter & Test Suite
        run: |
          ruff check .
          pytest tests/

      - name: Execute Scraper Pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_AUDIT_TAB: ${{ vars.SHEET_AUDIT_TAB || 'Tab Audit' }}
          MAX_ITEMS_PER_RUN: ${{ inputs.limit || '25' }}
        run: |
          python main.py

      - name: Commit Updated State & Artifacts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A data/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(data): update competition feed and state [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi
